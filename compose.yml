services:
  postgres:
    image: postgres:16
    container_name: postgres-cursos
    environment:
      POSTGRES_DB: ${DB_NAME:-curso_springboot}
      POSTGRES_USER: ${DB_USER:-devdb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: