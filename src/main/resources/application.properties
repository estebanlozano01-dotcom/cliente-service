# ── Servidor HTTP ─────────────────────────────────────────────────────────────
server.port=8080

# ── Version de la API ─────────────────────────────────────────────────────────
api.version=v1

# ── Conexion a PostgreSQL ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/curso_springboot
spring.datasource.username=devdb
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# create-drop: crea las tablas al iniciar, las borra al apagar
spring.jpa.hibernate.ddl-auto=create-drop

# Muestra el SQL que genera Hibernate en la consola (util para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Actuator ──────────────────────────────────────────────────────────────────
management.server.port=8081
management.endpoints.web.exposure.include=health

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.denkitronik.clienteservice=INFO
logging.level.org.springframework=INFO