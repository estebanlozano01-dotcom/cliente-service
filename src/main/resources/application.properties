# ── Servidor HTTP ─────────────────────────────────────────────────────────────
server.port=8080

# ── Version de la API ─────────────────────────────────────────────────────────
api.version=v1

# ── Base de datos embebida por defecto ────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────

# create-drop: crea las tablas al iniciar, las borra al apagar
spring.jpa.hibernate.ddl-auto=create-drop

# Muestra el SQL que genera Hibernate en la consola (util para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Docker Compose is started explicitly so the app can also use a local PostgreSQL installation.
spring.docker.compose.enabled=false

# ── Actuator ──────────────────────────────────────────────────────────────────
management.server.port=8081
management.endpoints.web.exposure.include=health

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.denkitronik.clienteservice=INFO
logging.level.org.springframework=INFO